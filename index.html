<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>API Data Dashboard</h2>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" id="searchId" placeholder="Enter ID">
        <button id="searchBtn">Search</button>
    </div>

    <!-- TABLE -->
    <div class="table-container">

        <table id="dataTable">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Color</th>
                    <th>Capacity</th>
                    <th>CPU Model</th>
                    <th>Description</th>
                    <th>Screen Size</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Save</th>
                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

    <button id="addRowBtn">Add Row</button>

    <script src="script.js"></script>

</body>

</html>
